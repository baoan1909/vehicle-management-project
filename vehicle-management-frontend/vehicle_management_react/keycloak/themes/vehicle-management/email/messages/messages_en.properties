executeActionsBody=Qu\u1ea3n tr\u1ecb vi\u00ean v\u1eeba y\u00eau c\u1ea7u b\u1ea1n x\u00e1c minh t\u00e0i kho\u1ea3n Vehicle-management b\u1eb1ng c\u00e1ch th\u1ef1c hi\u1ec7n h\u00e0nh \u0111\u1ed9ng sau: X\u00e1c minh email. H\u00e3y nh\u1ea5p v\u00e0o li\u00ean k\u1ebft b\u00ean d\u01b0\u1edbi \u0111\u1ec3 b\u1eaft \u0111\u1ea7u qu\u00e1 tr\u00ecnh n\u00e0y.\n\nLi\u00ean k\u1ebft \u0111\u1ec3 x\u00e1c minh t\u00e0i kho\u1ea3n:\n{0}\n\nLi\u00ean k\u1ebft n\u00e0y s\u1ebd h\u1ebft h\u1ea1n sau 12 gi\u1edd.\n\nN\u1ebfu b\u1ea1n kh\u00f4ng bi\u1ebft v\u1ec1 y\u00eau c\u1ea7u n\u00e0y, vui l\u00f2ng b\u1ecf qua email n\u00e0y v\u00e0 s\u1ebd kh\u00f4ng c\u00f3 thay \u0111\u1ed5i n\u00e0o \u0111\u01b0\u1ee3c \u00e1p d\u1ee5ng.
