services:
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-quay.io/minio/mc:latest}
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing local/"$${MINIO_PUBLIC_BUCKET}"
        mc mb --ignore-existing local/"$${MINIO_PRIVATE_BUCKET}"
        mc anonymous set download local/"$${MINIO_PUBLIC_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:-vehicle-public}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-vehicle-private}
    restart: "no"

volumes:
  minio_data:
