spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1/__test__/jwks

app:
  rabbitmq:
    listener-enabled: false
  storage:
    minio:
      # Test-only placeholders. They allow the MinIO client bean to be created
      # without exposing or depending on a real storage service credential.
      endpoint: http://127.0.0.1:9000
      access-key: test-minio-access
      secret-key: test-minio-secret
  features:
    parking-location:
      admin-address-v2-enabled: true
      public-nearby-search-enabled: true
      customer-parking-map-enabled: true
      geocoding-provider-enabled: true
