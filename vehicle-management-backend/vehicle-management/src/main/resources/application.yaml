server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /vehicle-management

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
spring:
  config:
    import: "classpath:time.properties,optional:file:.env[.properties],optional:file:./config/time-override.properties"

  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vehicle_management_db}"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}

  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:60MB}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Flyway owns this table and creates it before applying the first migration.
    default-schema: public
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:20260818120200}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_HOST_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/vehicle-management}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}

  data:
    redis:
      repositories:
        enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:${MAIL_USERNAME:no-reply@coparking.local}}
    from-name: ${APP_MAIL_FROM_NAME:CoParking}
    portal-url: ${APP_MAIL_PORTAL_URL:http://localhost:5173/login}
  security:
    oauth2:
      audience: ${KEYCLOAK_AUDIENCE:vehicle-management-api}
      accepted-authorized-parties: ${KEYCLOAK_ACCEPTED_AUTHORIZED_PARTIES:vehicle-management-frontend}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:vehicle-management}
    frontend-client-id: ${KEYCLOAK_FRONTEND_CLIENT_ID:vehicle-management-frontend}
    post-action-redirect-uri: ${KEYCLOAK_ACTION_REDIRECT_URI:http://localhost:5173/login}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:vehicle-management-admin-service}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:DayLaMotChuKyBiMatCucKyDaiVaAnToanChoUngDungSpring2024}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      public-bucket: ${MINIO_PUBLIC_BUCKET:vehicle-public}
      private-bucket: ${MINIO_PRIVATE_BUCKET:vehicle-private}
      public-url-base: ${MINIO_PUBLIC_URL_BASE:}
      image-max-size-bytes: ${MINIO_IMAGE_MAX_SIZE_BYTES:5242880}
      image-max-width-pixels: ${MINIO_IMAGE_MAX_WIDTH_PIXELS:1280}
      image-jpeg-quality: ${MINIO_IMAGE_JPEG_QUALITY:0.85}
  ocr:
    enabled: ${OCR_ENABLED:true}
    base-url: ${OCR_BASE_URL:http://localhost:8010}
    internal-token: ${OCR_INTERNAL_TOKEN:dev-ocr-internal-token}
    confidence-threshold: ${OCR_CONFIDENCE_THRESHOLD:0.70}
  payment:
    vnpay:
      enabled: ${VNPAY_ENABLED:false}
      version: ${VNPAY_VERSION:2.1.0}
      command: ${VNPAY_COMMAND:pay}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:}
      ipn-url: ${VNPAY_IPN_URL:}
      frontend-return-url: ${VNPAY_FRONTEND_RETURN_URL:http://localhost:5173/payment/vnpay-return}
      order-type: ${VNPAY_ORDER_TYPE:other}
      minimum-amount: ${VNPAY_MINIMUM_AMOUNT:10000}
  ai:
    assistant-enabled: ${AI_ASSISTANT_ENABLED:false}
    data-mode: ${AI_GEMINI_DATA_MODE:UNPAID}
    allow-unpaid-support-data: ${AI_ALLOW_UNPAID_SUPPORT_DATA:false}
    recent-message-limit: ${AI_ASSISTANT_RECENT_MESSAGE_LIMIT:8}
    max-attempts: ${AI_ASSISTANT_MAX_ATTEMPTS:3}
    prompt-version: ${AI_ASSISTANT_PROMPT_VERSION:support-assistant-v1}
    embedding:
      enabled: ${AI_EMBEDDING_ENABLED:false}
      vector-search-enabled: ${AI_EMBEDDING_VECTOR_SEARCH_ENABLED:true}
      lexical-fallback-enabled: ${AI_EMBEDDING_LEXICAL_FALLBACK_ENABLED:true}
      retry-max-attempts: ${AI_EMBEDDING_RETRY_MAX_ATTEMPTS:3}
      retry-jitter-enabled: ${AI_EMBEDDING_RETRY_JITTER_ENABLED:true}
      build-batch-size: ${AI_EMBEDDING_BUILD_BATCH_SIZE:5}
      pgvector-required: ${AI_PGVECTOR_REQUIRED:false}
    retrieval:
      final-top-k: ${AI_RETRIEVAL_FINAL_TOP_K:5}
      vector-candidate-limit: ${AI_RETRIEVAL_VECTOR_CANDIDATE_LIMIT:20}
      lexical-candidate-limit: ${AI_RETRIEVAL_LEXICAL_CANDIDATE_LIMIT:20}
      max-chunks-per-document: ${AI_RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT:3}
      rrf-rank-constant: ${AI_RETRIEVAL_RRF_RANK_CONSTANT:60}
      weight-vector: ${AI_RETRIEVAL_WEIGHT_VECTOR:0.6}
      weight-lexical: ${AI_RETRIEVAL_WEIGHT_LEXICAL:0.4}
      minimum-vector-score: ${AI_RETRIEVAL_MINIMUM_VECTOR_SCORE:0.15}
      minimum-lexical-score: ${AI_RETRIEVAL_MINIMUM_LEXICAL_SCORE:0.01}
      grounded-confidence-threshold: ${AI_RETRIEVAL_GROUNDED_CONFIDENCE_THRESHOLD:0.80}
      caution-confidence-threshold: ${AI_RETRIEVAL_CAUTION_CONFIDENCE_THRESHOLD:0.55}
      policy-version: ${AI_RETRIEVAL_POLICY_VERSION:retrieval-policy-v1}
      threshold-version: ${AI_RETRIEVAL_THRESHOLD_VERSION:retrieval-threshold-v1}
      unaccent-required: ${AI_RETRIEVAL_UNACCENT_REQUIRED:false}
    ingestion:
      enabled: ${AI_INGESTION_ENABLED:true}
      claim-limit: ${AI_INGESTION_CLAIM_LIMIT:3}
      worker-id-prefix: ${AI_INGESTION_WORKER_ID_PREFIX:kd-worker}
      max-attempts: ${AI_INGESTION_MAX_ATTEMPTS:3}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    cache:
      enabled: ${AI_CACHE_ENABLED:true}
      max-models-per-job-attempt: ${AI_MAX_MODELS_PER_JOB_ATTEMPT:3}
      ttl-jitter-percent: ${AI_CACHE_TTL_JITTER_PERCENT:10}
      key-hmac-secret: ${AI_CACHE_KEY_HMAC_SECRET:}
    circuit-breaker:
      failure-threshold: ${AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
  redis:
    enabled: ${REDIS_ENABLED:true}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    ssl-enabled: ${REDIS_SSL_ENABLED:false}
    environment: ${APP_ENV:local}
    service: ${APP_SERVICE_NAME:vehicle-management}

