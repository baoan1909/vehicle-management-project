# Application timezone foundation. This is trusted deployment configuration, never request input.
app.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
spring.datasource.hikari.connection-init-sql=SET TIME ZONE '${app.time-zone}'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=${app.time-zone}

# Framework and infrastructure timeouts. Existing keys and environment variables remain compatible.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
app.security.oauth2.jwk.connect-timeout-ms=${JWK_CONNECT_TIMEOUT_MS:3000}
app.security.oauth2.jwk.read-timeout-ms=${JWK_READ_TIMEOUT_MS:15000}
app.security.oauth2.jwk.connect-timeout=${JWK_CONNECT_TIMEOUT:${app.security.oauth2.jwk.connect-timeout-ms}ms}
app.security.oauth2.jwk.read-timeout=${JWK_READ_TIMEOUT:${app.security.oauth2.jwk.read-timeout-ms}ms}
app.storage.minio.presigned-url-expire-seconds=${MINIO_PRESIGNED_EXPIRE_SECONDS:900}
app.storage.minio.presigned-url-expiry=${MINIO_PRESIGNED_URL_EXPIRY:${app.storage.minio.presigned-url-expire-seconds}s}
app.ocr.connect-timeout-ms=${OCR_CONNECT_TIMEOUT_MS:1500}
app.ocr.read-timeout-ms=${OCR_READ_TIMEOUT_MS:10000}
app.ocr.connect-timeout=${OCR_CONNECT_TIMEOUT:${app.ocr.connect-timeout-ms}ms}
app.ocr.read-timeout=${OCR_READ_TIMEOUT:${app.ocr.read-timeout-ms}ms}
app.payment.vnpay.timeout-minutes=${VNPAY_TIMEOUT_MINUTES:15}
app.payment.vnpay.timeout=${VNPAY_TIMEOUT:${app.payment.vnpay.timeout-minutes}m}
app.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
app.redis.command-timeout=${REDIS_COMMAND_TIMEOUT:1s}

# Subscription lifecycle.
app.subscription.payment-timeout-hours=${SUBSCRIPTION_PAYMENT_TIMEOUT_HOURS:48}
app.subscription.payment-timeout=${SUBSCRIPTION_PAYMENT_TIMEOUT:${app.subscription.payment-timeout-hours}h}
app.scheduler.subscription-lifecycle.fixed-delay-ms=${SUBSCRIPTION_LIFECYCLE_SCHEDULER_FIXED_DELAY_MS:300000}
app.scheduler.subscription-lifecycle.initial-delay-ms=${SUBSCRIPTION_LIFECYCLE_SCHEDULER_INITIAL_DELAY_MS:60000}
app.scheduler.subscription-lifecycle.fixed-delay=${SUBSCRIPTION_LIFECYCLE_SCHEDULER_FIXED_DELAY:${app.scheduler.subscription-lifecycle.fixed-delay-ms}ms}
app.scheduler.subscription-lifecycle.initial-delay=${SUBSCRIPTION_LIFECYCLE_SCHEDULER_INITIAL_DELAY:${app.scheduler.subscription-lifecycle.initial-delay-ms}ms}

# Module-owned business and operational durations.
app.notification.pending-replay-window=${NOTIFICATION_PENDING_REPLAY_WINDOW:6h}
app.iam.verification-email.resend-cooldown=${VERIFICATION_EMAIL_RESEND_COOLDOWN:1m}
app.iam.verification-email.rate-window=${VERIFICATION_EMAIL_RATE_WINDOW:1h}
app.iam.verification-email.max-requests=${VERIFICATION_EMAIL_MAX_REQUESTS:5}
app.operations.shift.required-duration=${SHIFT_REQUIRED_DURATION:8h}
app.operations.shift.minimum-rest=${SHIFT_MINIMUM_REST:8h}
app.operations.support-ticket.escalation-rate-window=${SUPPORT_TICKET_ESCALATION_RATE_WINDOW:24h}
app.storage.access.parking-image-read-url-expiry=${PARKING_IMAGE_READ_URL_EXPIRY:15m}
app.storage.access.chat-attachment-read-url-expiry=${CHAT_ATTACHMENT_READ_URL_EXPIRY:15m}

# AI properties keep their existing semantic owners.
app.ai.retry-initial-delay=${AI_ASSISTANT_RETRY_INITIAL_DELAY:20s}
app.ai.request-timeout=${AI_ASSISTANT_REQUEST_TIMEOUT:20s}
app.ai.lock-safety-margin=${AI_ASSISTANT_LOCK_SAFETY_MARGIN:90s}
app.ai.assistant-job-fixed-delay-ms=${AI_ASSISTANT_JOB_FIXED_DELAY_MS:2500}
app.ai.assistant-job-initial-delay-ms=${AI_ASSISTANT_JOB_INITIAL_DELAY_MS:5000}
app.ai.model-catalog-sync-fixed-delay-ms=${AI_MODEL_CATALOG_SYNC_FIXED_DELAY_MS:86400000}
app.ai.model-catalog-sync-initial-delay-ms=${AI_MODEL_CATALOG_SYNC_INITIAL_DELAY_MS:60000}
app.ai.embedding.retry-initial-delay=${AI_EMBEDDING_RETRY_INITIAL_DELAY:1s}
app.ai.embedding.retry-max-delay=${AI_EMBEDDING_RETRY_MAX_DELAY:10s}
app.ai.embedding.build-fixed-delay-ms=${AI_EMBEDDING_BUILD_FIXED_DELAY_MS:5000}
app.ai.embedding.build-initial-delay-ms=${AI_EMBEDDING_BUILD_INITIAL_DELAY_MS:10000}
app.ai.embedding.build-lease-duration=${AI_EMBEDDING_BUILD_LEASE_DURATION:10m}
app.ai.ingestion.poll-fixed-delay-ms=${AI_INGESTION_POLL_FIXED_DELAY_MS:5000}
app.ai.ingestion.poll-initial-delay-ms=${AI_INGESTION_POLL_INITIAL_DELAY_MS:15000}
app.ai.ingestion.lock-duration=${AI_INGESTION_LOCK_DURATION:5m}
app.ai.ingestion.retry-initial-delay=${AI_INGESTION_RETRY_INITIAL_DELAY:1m}
app.ai.ingestion.retry-max-delay=${AI_INGESTION_RETRY_MAX_DELAY:30m}
app.ai.quality.job-stuck-tolerance=${AI_JOB_STUCK_TOLERANCE:30m}
app.ai.quality.candidate-stale-tolerance=${AI_CANDIDATE_STALE_TOLERANCE:60m}
app.ai.cache.query-embedding-ttl=${AI_REDIS_QUERY_EMBEDDING_TTL:24h}
app.ai.cache.public-retrieval-ttl=${AI_REDIS_PUBLIC_RETRIEVAL_TTL:15m}
app.ai.cache.customer-retrieval-ttl=${AI_REDIS_CUSTOMER_RETRIEVAL_TTL:10m}
app.ai.cache.tenant-retrieval-ttl=${AI_REDIS_TENANT_RETRIEVAL_TTL:5m}
app.ai.cache.negative-retrieval-ttl=${AI_REDIS_NEGATIVE_RETRIEVAL_TTL:30s}
app.ai.cache.public-grounded-answer-ttl=${AI_REDIS_PUBLIC_GROUNDED_ANSWER_TTL:15m}
app.ai.cache.customer-grounded-answer-ttl=${AI_REDIS_CUSTOMER_GROUNDED_ANSWER_TTL:5m}
app.ai.cache.tenant-grounded-answer-ttl=${AI_REDIS_TENANT_GROUNDED_ANSWER_TTL:5m}
app.ai.cache.single-flight-lock-ttl=${AI_REDIS_SINGLE_FLIGHT_LOCK_TTL:45s}
app.ai.cache.single-flight-wait=${AI_SINGLE_FLIGHT_WAIT:2s}
app.ai.circuit-breaker.failure-window=${AI_CIRCUIT_BREAKER_FAILURE_WINDOW:120s}
app.ai.circuit-breaker.open-duration=${AI_CIRCUIT_BREAKER_OPEN_DURATION:60s}
app.ai.circuit-breaker.min-open-duration=${AI_CIRCUIT_BREAKER_MIN_OPEN_DURATION:30s}
app.ai.circuit-breaker.max-open-duration=${AI_CIRCUIT_BREAKER_MAX_OPEN_DURATION:300s}
app.ai.circuit-breaker.half-open-lock-ttl=${AI_CIRCUIT_BREAKER_HALF_OPEN_LOCK:30s}
app.ai.circuit-breaker.retention-margin=${AI_CIRCUIT_BREAKER_RETENTION_MARGIN:5m}
