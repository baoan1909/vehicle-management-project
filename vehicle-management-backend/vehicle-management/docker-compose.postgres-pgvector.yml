services:
  pgvector:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      args:
        PGVECTOR_IMAGE: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.6-pg17}
    image: ${POSTGRES_SPATIAL_IMAGE:-vehicle-management/postgres-pgvector-postgis:17}
    container_name: ${PGVECTOR_CONTAINER_NAME:-vehicle-pgvector}
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-vehicle_management_db}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/vehicle-postgres-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  pgvector_data:
