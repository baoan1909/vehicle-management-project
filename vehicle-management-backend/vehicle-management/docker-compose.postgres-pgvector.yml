services:
  pgvector:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:0.8.6-pg17}
    container_name: ${PGVECTOR_CONTAINER_NAME:-vehicle-pgvector}
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-vehicle_management_db}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-vehicle_management_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
