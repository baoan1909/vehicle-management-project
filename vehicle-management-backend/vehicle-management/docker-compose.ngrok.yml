services:
  ngrok:
    image: ${NGROK_IMAGE:-ngrok/ngrok:latest}
    container_name: ${NGROK_CONTAINER_NAME:-vehicle-ngrok}
    command:
      - http
      - --domain=${NGROK_DOMAIN:?Set NGROK_DOMAIN in .env}
      - host.docker.internal:${BACKEND_HOST_PORT:-8080}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NGROK_INSPECTION_HOST_PORT:-4040}:4040"
    restart: unless-stopped
