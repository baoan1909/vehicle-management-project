services:
  db:
    image: ${KEYCLOAK_DB_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-pass}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
    ports:
      - "${KEYCLOAK_DB_HOST_PORT:-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME:-postgres} -d ${KEYCLOAK_DB_NAME:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6.1}
    command: ${KEYCLOAK_COMMAND:-start-dev}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-postgres}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-pass}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_HOST_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
