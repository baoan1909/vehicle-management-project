services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: vehicle_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: An@19092003
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vehicle_management_db
      DB_USERNAME: postgres
      DB_PASSWORD: An@19092003
    ports:
      - "8080:8080"

volumes:
  postgres_data:
