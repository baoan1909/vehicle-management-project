name: CoParking CI/CD

on:
  # develop is the integration branch that will later deploy automatically to staging.
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

# Every CI job starts with read-only repository access. Jobs that publish images
# request their narrowly-scoped package permission in a later phase.
permissions:
  contents: read

env:
  BACKEND_DIR: vehicle-management-backend/vehicle-management
  FRONTEND_DIR: vehicle-management-frontend/vehicle_management_react

jobs:
  secret-scan:
    name: 01 - Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository and Git history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-build:
    name: 02 - Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      # The summary and command duration make the commit-to-staging target measurable.
      - name: Build frontend
        shell: bash
        run: |
          echo "## Frontend build" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/time -f "Duration: %E" npm run build

      - name: Upload frontend bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist
          if-no-files-found: warn
          retention-days: 7

  frontend-lint:
    name: 03 - Frontend static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      # tsc --noEmit validates strict TypeScript without changing project files.
      - name: Check TypeScript types
        shell: bash
        run: |
          echo "## Frontend static analysis" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/time -f "Duration: %E" npm run lint

  frontend-test:
    name: 04 - Frontend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Run frontend tests and save log
        shell: bash
        run: |
          set -o pipefail
          echo "## Frontend tests" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/time -f "Duration: %E" npm test 2>&1 | tee frontend-test.log

      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: ${{ env.FRONTEND_DIR }}/frontend-test.log
          if-no-files-found: warn
          retention-days: 14

  backend-build:
    name: 05 - Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant Maven wrapper permission
        run: chmod +x mvnw

      - name: Package backend without tests
        shell: bash
        run: |
          echo "## Backend build" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/time -f "Duration: %E" ./mvnw -B -DskipTests package

      - name: Upload backend package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: ${{ env.BACKEND_DIR }}/target/*.jar
          if-no-files-found: warn
          retention-days: 7

  backend-static-analysis:
    name: 06 - Backend static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant Maven wrapper permission
        run: chmod +x mvnw

      # This profile enables javac -Xlint:all; it reports static warnings
      # without mass-reformatting existing backend source.
      - name: Compile with Java static-analysis warnings
        shell: bash
        run: |
          set -o pipefail
          echo "## Backend static analysis" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/time -f "Duration: %E" ./mvnw -B -Pstatic-analysis -DskipTests clean compile 2>&1 | tee backend-static-analysis.log

      - name: Upload backend static-analysis log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-static-analysis-log
          path: ${{ env.BACKEND_DIR }}/backend-static-analysis.log
          if-no-files-found: warn
          retention-days: 14

  backend-test:
    name: 07 - Backend test
    runs-on: ubuntu-latest
    # Integration tests exercise Flyway, PostGIS and pgvector. These values
    # create an isolated disposable database on the GitHub Actions runner.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: vehicle_management_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # SpatialFreshDatabaseContainerTest reuses the image built by the setup
      # step below. This avoids pulling an unpublished image from Docker Hub.
      POSTGRES_SPATIAL_TEST_IMAGE: coparking-ci-postgres
      JPA_SHOW_SQL: "false"
      APP_MAIL_ENABLED: "false"
      OCR_ENABLED: "false"
      REDIS_ENABLED: "false"
      AI_CACHE_ENABLED: "false"
      AI_ASSISTANT_ENABLED: "false"
      AI_EMBEDDING_ENABLED: "false"
      AI_INGESTION_ENABLED: "false"
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant Maven wrapper permission
        run: chmod +x mvnw

      # The project database image installs both extensions required by schema
      # migrations. The runner is ephemeral, so no test data is retained.
      - name: Start disposable PostgreSQL with PostGIS and pgvector
        shell: bash
        run: |
          docker build \
            --tag coparking-ci-postgres \
            --file docker/postgres/Dockerfile \
            .
          docker run --detach \
            --name coparking-ci-postgres \
            --env POSTGRES_DB="$DB_NAME" \
            --env POSTGRES_USER="$DB_USERNAME" \
            --env POSTGRES_PASSWORD="$DB_PASSWORD" \
            --publish 5432:5432 \
            coparking-ci-postgres
          # The image keeps its health probe as a reusable script. Execute it
          # directly here because this CI-only docker run does not inherit the
          # healthcheck declared by the local Docker Compose file.
          for attempt in {1..30}; do
            if docker exec coparking-ci-postgres /usr/local/bin/vehicle-postgres-healthcheck; then
              exit 0
            fi
            sleep 2
          done
          docker logs coparking-ci-postgres
          exit 1

      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          echo "## Backend tests" >> "$GITHUB_STEP_SUMMARY"
          /usr/bin/time -f "Duration: %E" ./mvnw -B test 2>&1 | tee backend-test.log

      - name: Upload Surefire reports and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            ${{ env.BACKEND_DIR }}/target/surefire-reports/**
            ${{ env.BACKEND_DIR }}/backend-test.log
          if-no-files-found: warn
          retention-days: 14

  frontend-dependency-scan:
    name: 08 - Frontend dependency scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      # Preserve the complete report for review, including development-only
      # findings. The next step is the release gate for shipped dependencies.
      - name: Export complete npm audit report
        shell: bash
        run: npm audit --json > npm-audit-full.json || true

      - name: Block HIGH or CRITICAL vulnerabilities in runtime dependencies
        shell: bash
        run: |
          echo "## Frontend dependency scan" >> "$GITHUB_STEP_SUMMARY"
          # --omit=dev matches what is installed in the production image.
          npm audit --omit=dev --audit-level=high

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-npm-audit-report
          path: ${{ env.FRONTEND_DIR }}/npm-audit-full.json
          if-no-files-found: warn
          retention-days: 30

  backend-dependency-scan:
    name: 09 - Backend dependency scan
    runs-on: ubuntu-latest
    # Wait for the package job so its Maven cache has been saved before Trivy
    # resolves the backend dependency graph on this fresh runner.
    needs: backend-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          # setup-java caches ~/.m2/repository using the backend pom.xml key.
          # This is the same cache strategy as the backend build job.
          cache: maven
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pom.xml

      - name: Grant Maven wrapper permission
        working-directory: ${{ env.BACKEND_DIR }}
        run: chmod +x mvnw

      - name: Resolve backend dependencies from Maven cache
        working-directory: ${{ env.BACKEND_DIR }}
        shell: bash
        run: |
          # Trivy reads Maven metadata while building the dependency graph.
          # Resolve it first so Trivy does not make a burst of requests to
          # Maven Central from an ephemeral GitHub-hosted runner.
          ./mvnw -B -DskipTests dependency:go-offline

      # Trivy identifies vulnerable Java dependencies directly from the backend
      # project. Unlike the NVD bulk sync used by Dependency-Check, it keeps
      # the commit-to-staging path bounded and does not require an NVD key.
      - name: Block HIGH or CRITICAL backend dependency findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Pin the scanner binary independently from the action release.
          # v0.70.0 is rejected by Trivy's current version check on runners.
          version: v0.75.0
          scan-type: fs
          scan-ref: ${{ env.BACKEND_DIR }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-backend-dependency-report.json

      - name: Upload backend dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trivy-dependency-report
          path: trivy-backend-dependency-report.json
          if-no-files-found: warn
          retention-days: 30

  container-security-scan:
    name: 10 - Container and filesystem security scan
    runs-on: ubuntu-latest
    # The backend build warms the same Maven cache first. This prevents the
    # filesystem scanner from resolving every Maven POM from a fresh runner.
    needs: backend-build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: ${{ env.BACKEND_DIR }}/pom.xml

      - name: Populate Maven cache for filesystem scan
        working-directory: ${{ env.BACKEND_DIR }}
        shell: bash
        run: |
          chmod +x mvnw
          # Resolve Maven metadata once with Maven's cache before Trivy reads
          # the project. This avoids a rate-limit burst to Maven Central.
          ./mvnw -B -DskipTests dependency:go-offline

      # Dependency lockfiles are assessed by the dedicated npm/OWASP jobs.
      # This filesystem scan catches secrets and infrastructure misconfiguration
      # before an image reaches a registry. Each scan is allowed to finish so
      # its JSON report is retained; the final gate below still fails the job.
      - name: Scan repository filesystem with Trivy
        id: trivy_filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-filesystem-report.json
          # Flyway SQL is covered by Gitleaks; excluding the very large history
          # here keeps this secret/misconfiguration scan memory-bounded.
          skip-files: vehicle-management-backend/vehicle-management/src/main/resources/db/migration/**

      - name: Build images locally for vulnerability scanning
        shell: bash
        run: |
          docker build --tag coparking-backend:security --file "${{ env.BACKEND_DIR }}/Dockerfile" "${{ env.BACKEND_DIR }}"
          docker build --tag coparking-frontend:security --file "${{ env.FRONTEND_DIR }}/Dockerfile" "${{ env.FRONTEND_DIR }}"

      - name: Scan backend image with Trivy
        id: trivy_backend_image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          version: v0.75.0
          image-ref: coparking-backend:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-backend-image-report.json

      - name: Scan frontend image with Trivy
        id: trivy_frontend_image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          version: v0.75.0
          image-ref: coparking-frontend:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-frontend-image-report.json

      # Keep every report even when a scanner found a blocking issue. This
      # makes remediation auditable and avoids losing later scan results.
      - name: Upload Trivy security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-filesystem-report.json
            trivy-backend-image-report.json
            trivy-frontend-image-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Trivy security gate
        if: >-
          steps.trivy_filesystem.outcome == 'failure' ||
          steps.trivy_backend_image.outcome == 'failure' ||
          steps.trivy_frontend_image.outcome == 'failure'
        shell: bash
        run: |
          echo "One or more Trivy scans found HIGH or CRITICAL security findings." >&2
          echo "Download the trivy-security-reports artifact to identify and remediate them." >&2
          exit 1

  cd-images:
    name: CD - Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - frontend-build
      - frontend-lint
      - frontend-test
      - backend-build
      - backend-static-analysis
      - backend-test
      - frontend-dependency-scan
      - backend-dependency-scan
      - container-security-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          REPOSITORY_LOWER="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${REPOSITORY_LOWER}/coparking-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${REPOSITORY_LOWER}/coparking-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          file: ${{ env.BACKEND_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend }}:latest
            ${{ steps.images.outputs.backend }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.FRONTEND_DIR }}
          file: ${{ env.FRONTEND_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
