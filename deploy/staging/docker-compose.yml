name: coparking-staging

services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable CI image tag}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-.env}
    environment:
      APP_ENV: staging
      SPRING_PROFILES_ACTIVE: staging
      JPA_SHOW_SQL: "false"
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - coparking

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable CI image tag}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coparking

networks:
  coparking:
    driver: bridge
